camera_id: admin_in
camera_name: 综保A区行政车道进
# ROI 沿左侧白色护栏与右侧黄黑立柱标定，覆盖行政车道、排除右侧主路（大货车）和左侧绿化带
roi:
  polygon:
  - [0, 1080]
  - [1200, 1080]
  - [1250, 320]
  - [850, 300]
  - [0, 600]
# 车辆从远端 y≈420 驶向镜头 y≈1070，先过入口线（y=500）再过出口线（y=950）。
# 两条线必须横跨整个车道宽度，否则未跨线的车辆不会被判为“进入/离开”而被丢弃。
entry_line:
  p1: [300, 500]
  p2: [1230, 500]
exit_line:
  p1: [80, 950]
  p2: [1200, 950]
# 透视标定：现场测量 >=4 组「像素坐标 -> 地面米制坐标」控制点后，
# 运行 scripts/calibrate_homography.py --update-config 写入 3x3 homography。
# 填入后 geometry_level 自动变为 calibrated，speed/path/aggregation 字段变为可靠。
calibration:
  # 2026-11-23 现场标定，取 11:35:16 帧（1920x1080）。
  # 地面坐标定义：原点 = 人行护栏第 1 立柱的边缘点，x 沿护栏（远离镜头为正），
  # y 垂直护栏指向车道（离护栏越远越大），单位米。
  #
  # 控制点依据（现场实测）：
  #   人行护栏立柱边缘间距            3.00 m（同一立柱两边缘 0.10 m 交叉校验，比例差 1%）
  #   减速带第 1/14/17 颗螺栓         0.00 / 3.14 / 3.86 m（每节 0.24 m，13/16 节）
  # 拟合 RMS = 2.19 px。
  # 自检：车道宽度在 y=600/700/800/900 四行分别为 4.19/4.28/4.19/4.16 m（差 <3%），
  #       轨迹速度中位 16.7 km/h、p90 23.5 km/h，符合闸口减速带前的通行速度。
  homography:
    - [0.00571341, -0.01864996, 8.06133876]
    - [0.00485923, 0.01778922, -10.12483436]
    - [0.00022825, 0.00072659, 1.00000000]
  # 退化路径（homography 缺失时）的近似比例。实测纵向约 70 px/m、横向约 250 px/m，
  # 单一常数无法表达该各向异性，仅作兜底；有 homography 时此值不参与换算。
  px_per_meter: 70.0

anomaly:
  # 期望异常比例：按机位调参。66 分钟完整段上 0.05 会到 18%，
  # 0.02 可回到 14% 左右；配合 --max-alert-rate 可硬性封顶。
  contamination: 0.05
