camera_id: admin_out
camera_name: 综保A区行政车道出
# 车道走向：车辆从右上（约 1640,340）斜向驶向左下（约 520,1070）。
# ROI 覆盖这条对角走廊，排除左上建筑/绿化、左侧护栏后方停放的车辆、以及右侧黄黑路缘。
roi:
  polygon:
  - [1820, 280]
  - [1150, 400]
  - [0, 640]
  - [0, 1080]
  - [1300, 1080]
# 入口线在远端 y=450，出口线在近端 y=950，均横跨走廊宽度。
entry_line:
  p1: [1200, 450]
  p2: [1700, 450]
exit_line:
  p1: [350, 950]
  p2: [1050, 950]
calibration:
  px_per_meter: 50.0
