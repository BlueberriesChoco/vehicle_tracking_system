camera_id: cl_north
camera_name: 中央路北
# 直道机位（限速 30），车流沿画面左下—右上方向行驶，路侧有停放车辆。
# 自动推导把线画到了路肩上，导致只判到路边停放车（停留 15-21 分钟），此处手工修正：
# 入口线在远端、出口线在近端，均横跨行车道，避开左侧停车带。
roi:
  polygon:
  - [60, 720]
  - [380, 210]
  - [1060, 170]
  - [960, 720]
entry_line:
  p1: [400, 245]
  p2: [1010, 220]
exit_line:
  p1: [70, 690]
  p2: [950, 700]
calibration:
  px_per_meter: 0.0
anomaly:
  contamination: 0.05
