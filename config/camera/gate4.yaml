camera_id: gate4
camera_name: 内卡口4
# 通道型机位：车辆沿黄黑减速带所在车道左右通行。
# 自动推导把出口线画到了右侧集装箱上，导致车辆只进不出、通行记录为 0，此处手工修正。
#
# 2026-11-25 二次修正：原先 ROI 上边界 y=430，实测车辆中心在 y≈370–393，
# 即车走的是画面上方那条带减速带的车道，而 ROI 框住的是下方空地。
# 12 帧抽样检出 2 辆车、全部落在 ROI 外，8000 帧通行记录为 0 即由此而来。
# 现将 ROI 上边界提到 y=280，进出线同步延长以跨过实际上车道。
roi:
  polygon:
  - [0, 280]
  - [1560, 300]
  - [1560, 820]
  - [0, 780]
entry_line:
  p1: [260, 280]
  p2: [260, 800]
exit_line:
  p1: [1200, 300]
  p2: [1200, 830]
calibration:
  # 未标定：速度/路径/聚集特征会被门控，本次实验只用通行时间与外观
  px_per_meter: 0.0
anomaly:
  contamination: 0.05
