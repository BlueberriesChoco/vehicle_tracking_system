# 需要在有把握时用 scripts/calibrate_camera.py 手工补 entry_line / exit_line。
roi:
  polygon:
  - [438, 697]
  - [102, 953]
  - [101, 953]
  - [100, 943]
  - [100, 942]
  - [100, 778]
  - [235, 715]
  - [253, 711]
  - [293, 704]
calibration:
  # 未标定：速度/路径/聚集特征会被门控。现场量到 >=4 组控制点后填 homography。
  px_per_meter: 0.0
anomaly:
  contamination: 0.05
