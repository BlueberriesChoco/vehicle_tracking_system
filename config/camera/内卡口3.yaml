# 需要在有把握时用 scripts/calibrate_camera.py 手工补 entry_line / exit_line。
roi:
  polygon:
  - [1919, 445]
  - [1572, 619]
  - [574, 613]
  - [331, 338]
  - [423, 302]
  - [1355, 220]
  - [1897, 248]
  - [1900, 249]
  - [1919, 444]
calibration:
  # 未标定：速度/路径/聚集特征会被门控。现场量到 >=4 组控制点后填 homography。
  px_per_meter: 0.0
anomaly:
  contamination: 0.05
