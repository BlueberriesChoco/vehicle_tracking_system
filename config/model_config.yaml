detector:
  name: "yolov8s"
  weights: "models/yolov8s.pt"
  img_size: 640
  conf_threshold: 0.35
  iou_threshold: 0.45
  classes: [2, 3, 5, 7]
  device: 0

# Phase 2: 车辆属性特征提取（需模型文件时设置 enabled: true）
# color 和 classifier 可在无模型时用启发式方法工作

color:
  enabled: true                   # HSV 聚类不需要模型文件
  method: "hsv_clustering"

classifier:
  enabled: true                   # 几何推断不需要模型文件
  model_name: "mobilenet_v3_small"
  weights: "models/vehicle_type_model.pth"    # 可选：有 CNN 模型时更准确

plate:
  enabled: true                   # 优先使用专用YOLO车牌模型，缺失时回退形态学检测
  detector_weights: "models/license_plate_yolov8.pt"
  detector_conf: 0.35
  # 实测：1080p 下车牌高度约 60px，easyocr 会把 87316 读成 873061、
  # 且英文模型读不出省份汉字。提高门槛，宁可不输出也不要错误车牌污染匹配。
  min_plate_width: 120
  ocr_engine: "easyocr"
  ocr_lang: "en"
  ocr_min_conf: 0.7

reid:
  enabled: true
  # 车辆专用 ONNX ReID（CLIP-ReID / ViT，512 维）——目前唯一实测有区分度的后端：
  #   同车跨帧 0.715–0.890（均值 0.78），异车 0.653–0.787（均值 0.71）。
  # 权重 329 MB，不入库；文件缺失时自动回退 HSV 直方图。
  # 其他实测不可用的方案：ImageNet ResNet50（物体级）、OSNet/MSMT17（行人模型）。
  backend: "onnx"                 # auto / onnx / torchreid / torchvision / histogram
  model_name: "osnet_x1_0"
  weights: "models/vehicle_reid.onnx"
  allow_torchvision_fallback: false
  embedding_dim: 512



