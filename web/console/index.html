<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>综保区行政通道 · 车辆异常排查</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <strong>综保区行政通道 · 车辆异常排查</strong>
      <span class="sub" id="sysStatus"></span>
    </div>
    <div class="actions">
      <label class="budget">
        排序
        <select id="sort">
          <option value="risk" selected>综合排序</option>
          <option value="behavior">按行为异常</option>
          <option value="trajectory">按轨迹残差</option>
        </select>
      </label>
      <label class="budget">
        本次核查
        <select id="budget">
          <option value="10">10 辆</option>
          <option value="20" selected>20 辆</option>
          <option value="50">50 辆</option>
          <option value="0">全部</option>
        </select>
      </label>
      <button id="refresh" type="button">刷新</button>
    </div>
  </header>

  <div id="banner" class="banner hidden"></div>

  <main class="layout">
    <section class="panel runs">
      <h2>录像批次 <span class="count" id="runCount"></span></h2>
      <div id="runList" class="list"></div>
    </section>

    <section class="panel review">
      <h2>待核查车辆 <span class="count" id="reviewCount"></span></h2>
      <p class="hint">按可疑程度排序，供人工挑选核查对象。</p>
      <div class="kpis" id="kpis"></div>
      <div class="table-wrap">
        <table id="reviewTable">
          <thead>
            <tr>
              <th>#</th><th>车辆</th><th>通过时间</th><th>时长</th><th>可疑度</th><th>主要原因</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section class="panel detail">
      <h2>车辆详情</h2>
      <div id="detailEmpty" class="empty">从中间列表选一辆车</div>
      <div id="detailBody" class="hidden"></div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
